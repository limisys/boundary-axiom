    line: A
    statement: C_H=∫h(σ(z))dz=π²/3。
    state: formalized
    theorem: "BoundaryTheory.C_H_eq_pi_sq_div_three"
    paper: {A: "§5"}
    note: 源码入仓；干净重建；公理仅 [propext, Classical.choice, Quot.sound]。

  # ---------- B 线：有如何发生 ----------
  - id: C03
