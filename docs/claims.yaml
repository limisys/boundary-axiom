    theorem: "SharpnessClosure.fix_c_eq_decided,FaceIdentification.canonical_identifies,ObservableProxy.membership_is_threshold_bridge"
    paper: {B: "§3"}
  - id: C06
    line: B
    statement: 弱形式 no-go：只依赖 w 的规范不变谓词恒真或恒假，故挑不出唯一水平；水平是自由参数、值层数据定不出它。
    state: formalized
    theorem: "LevelSelection.gaugeInvPrinciple_notSelects,LevelSelection.selfConsistency_selects,LevelSelection.alternative_selector_selects,GaugeNoGo.level_free"
    paper: {B: "§3"}
