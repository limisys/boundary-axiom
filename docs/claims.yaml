# state: formalized | verified | settled | proposed
# theorem: 逗号分隔的 Lean 声明名（仅 formalized 需要）；file 可省略，claim_index 会在 lean/ 中查找
claims:
  # ---------- shared ----------
  - id: C01
    line: shared
    statement: 研究问题从「有是什么」改为「有如何发生」；心智与边界是场景名/占位符。
    state: settled
    theorem: ""
    paper: {A: "§1", B: "§1"}
  - id: C02
    line: shared
    statement: 核 b=2σ(-|κ(x-μ)|)；闭包族 c；边界=Fix(c)，判据={b≤θ}。
    state: settled
    theorem: ""
