    statement: 一般 C_F 结构定律：H=C_F/κ、κ*=√(αC_F/c₀)、σ*=αC_F/C₀ 对任意单调 F 成立。
    state: verified
    theorem: ""
    paper: {A: "§3"}
    note: 解析+数值；值层仅 logistic 机检（C04）。
  - id: A2
    line: A
    statement: 有效域判据修正：旧判据不充分；反例族 1−p∝1/(z ln²z) 使 C_F~ln ln L 发散；修正判据 ∫(1−p)ln(1/(1−p))<∞。
    state: verified
    theorem: ""
    paper: {A: "§4"}
    note: 渐近解析判定 + 数值佐证；未形式化。
  - id: A3
    line: A
    statement: "H–σ 反平方：σ=σ₀C_H²/H²（logistic: σ₀π⁴/(9H²)）。"
    state: settled
    theorem: ""
    paper: {A: "§2"}
    note: 建模选择的代数后果。
  - id: C04
    line: A
    statement: V(κ)=c₀κ+αC_F/κ 的极小点唯一 κ*=√(αC_F/c₀)，两代价同倍缩放不变。
    state: formalized
    theorem: "ValueLayerMin.V_global_min,ValueLayerMin.V_eq_min_iff,ValueLayerMin.amgm_eq_iff"
    paper: {A: "§2"}
    note: 值层用 BoundaryTheory.V（C_F=π²/3 实例）。
