# 统一仓 Lake 配置（便携路径：首次使用需 `lake update && lake exe cache get`）
# 离线校验请用 `python3 scripts/build.py`（只读既有 Mathlib packages，不联网）。
name = "BoundaryProgrammeUnified"
defaultTargets = ["BoundaryProgramme"]

